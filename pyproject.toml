[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audacity4-mcp"
version = "0.1.0"
description = "MCP server for AI-driven audio editing in Audacity 4"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Daniel Hodgetts" },
]
keywords = ["audacity", "audacity4", "mcp", "audio", "ai", "model-context-protocol", "vst3", "claude", "audio-editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
]
requires-python = ">=3.10"
dependencies = [
    # Upper-bounded deliberately: mcp 2.0.0 is a real, confirmed breaking
    # release (renamed/restructured mcp.server.fastmcp, which every tool
    # module here imports as FastMCP) - a clean install with no upper
    # bound resolves 2.x and fails immediately on import.
    "mcp[cli]>=1.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/xDarkzx/Audacity4-MCP"
Issues = "https://github.com/xDarkzx/Audacity4-MCP/issues"
Changelog = "https://github.com/xDarkzx/Audacity4-MCP/blob/main/CHANGELOG.md"

[project.scripts]
audacity4-mcp = "server4.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server4"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff.lint]
# Real bugs (F, pyflakes) and real security patterns (S, bandit port) -
# deliberately excludes E/W (pycodestyle style/formatting), which isn't
# worth enforcing for this project.
select = ["F", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests are written - not a stripped-under-`-O`
# production risk, since tests never ship or run with -O.
"tests/*" = ["S101"]
