[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audacity4-mcp"
version = "0.1.0"
description = "MCP server for AI-driven audio editing in Audacity 4"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "websockets>=12.0",
]

[project.scripts]
audacity4-mcp = "server4.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server4"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
